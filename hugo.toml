baseURL = 'https://example.org/'
locale = 'en-us'
title = 'coffee_thoughts'
theme = ['PaperMod']

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]

[params]
  math = true
  [params.homeInfoParams]
    Title = "Hello World!"
    Content = """These are my personal essays/notes/others mostly on tech, economics, philosophy, and literature.  
    If I find them interesting enough, I will post them here."""

  [[params.socialIcons]]
    name = "Github"
    url = "https://github.com/invalidcode232"

  [[params.socialIcons]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/james-sungarda"
  
[caches]
  [caches.images]
    dir = ':cacheDir/images'
